name: Tests

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.2, 8.3, 8.4, 8.5 ]
        stability: [ prefer-stable ]

    name: P${{ matrix.php }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: composer test

  # Same intent as street-orb/spectre-orb's composer_audit, adapted for a
  # library: there's no committed composer.lock, so resolve the tree first.
  # COMPOSER_NO_SECURITY_BLOCKING stops Composer 2.9+ silently skipping
  # vulnerable versions during update, so the audit sees what the composer.json
  # constraints actually allow.
  composer-audit:
    runs-on: ubuntu-latest
    name: composer-audit

    env:
      COMPOSER_NO_SECURITY_BLOCKING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      # Report-only: shows advisories reachable at the lowest versions our
      # runtime constraints allow. Mostly transitive, so it never fails the build.
      - name: Composer audit (prefer-lowest, report only)
        run: |
          composer update --prefer-lowest --no-dev --prefer-dist --no-interaction --no-audit --no-scripts
          composer audit --no-dev --abandoned=report || echo "::warning::Advisories reachable at lowest constraints (report only)"

      # Gate: what a consumer gets on a fresh install today.
      - name: Composer audit
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-audit --no-scripts
          composer audit --abandoned=report
